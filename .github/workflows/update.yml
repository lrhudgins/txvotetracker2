name: Refresh early vote tracker
on:
  schedule:
    # 18:17 UTC = 1:17 PM CDT / 12:17 PM CST, after next-day county updates.
    - cron: '17 18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'docs/index.html'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: early-vote-update
  cancel-in-progress: false
jobs:
  update:
    if: ${{ vars.LOCAL_UPDATES_ONLY != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Prepare district and reference precinct map
        run: python scripts/prepare_map.py
      - name: Fetch rosters and publish aggregate snapshots
        run: python scripts/update.py
      - name: Save dashboard and daily history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Refresh early voting aggregates"
            git push
          fi

